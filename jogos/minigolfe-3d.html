<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Minigolfe 3D</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#2d6a4f;font-family:system-ui,Segoe UI,Roboto,sans-serif;touch-action:none}
  canvas{display:block}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;pointer-events:none}
  .chip{background:#0009;color:#fff;font-weight:800;padding:6px 14px;border-radius:20px;font-size:15px}
  #power{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(60vw,300px);height:14px;background:#0006;border-radius:8px;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .2s}
  #power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#52b788,#ffd166,#e63946)}
  #tip{position:fixed;bottom:50px;width:100%;text-align:center;color:#fff;font-weight:700;text-shadow:0 2px 4px #000;pointer-events:none}
  #msg{position:fixed;top:40%;width:100%;text-align:center;color:#fff;font-size:clamp(28px,8vw,52px);font-weight:900;text-shadow:0 3px 8px #000;pointer-events:none;opacity:0;transition:opacity .3s}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1b4332e6;color:#fff;text-align:center;padding:20px}
  .screen h1{font-size:clamp(28px,7vw,46px)}
  .screen p{max-width:440px;line-height:1.4;opacity:.9}
  #levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  #levels button,.big{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 0;width:58px;background:#ffd166;color:#222;cursor:pointer;box-shadow:0 4px 0 #b08a2e;display:flex;flex-direction:column;align-items:center}
  #levels button small{font-size:11px;font-weight:600}
  #levels button:disabled{background:#555;box-shadow:0 4px 0 #333;color:#999}
  .big{width:auto;padding:12px 26px;display:inline-block}
  .hidden{display:none!important}
  #reset{position:fixed;right:10px;bottom:10px;border:0;border-radius:50%;width:46px;height:46px;font-size:22px;background:#fff;cursor:pointer;box-shadow:0 3px 8px #0005}
</style>
</head>
<body>
<div id="hud">
  <span class="chip" id="hHole">Buraco 1</span>
  <span class="chip" id="hPar">Par 2</span>
  <span class="chip" id="hStrokes">Tacadas 0</span>
  <span class="chip" id="hTotal">Total 0</span>
</div>
<div id="tip">Arraste para trás e solte para tacar</div>
<div id="power"><i></i></div>
<div id="msg"></div>
<button id="reset" title="Menu">☰</button>
<div id="menu" class="screen">
  <h1>⛳ Minigolfe 3D</h1>
  <p>Arraste o dedo (ou o mouse) para trás, como um estilingue, e solte para tacar. Evite a água, cuidado com a areia e com os moinhos!</p>
  <div id="levels"></div>
</div>
<div id="over" class="screen hidden">
  <h1 id="oTitle"></h1><p id="oText"></p>
  <button class="big" id="oBtn"></button>
  <button class="big" id="oMenu" style="background:#8ecae6;box-shadow:0 4px 0 #4a8fb0">Menu</button>
</div>

<script>
/* ===== SONS DO FLIPERAMA (gerados pelo navegador, sem arquivos) — tecla M liga/desliga ===== */
const SOM=(()=>{let A=null,mudo=false;

 function ac(){if(!A){try{A=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(A.state==='suspended')A.resume();return A}

 addEventListener('keydown',e=>{if((e.key==='m'||e.key==='M')&&!e.repeat&&!(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))){mudo=!mudo;try{localStorage.setItem('fliperama-mudo',mudo?'1':'0')}catch(err){}}});
 function tom(f,d,tipo,vol,f2,atraso){const a=ac();if(!a||mudo||a.state!=='running')return;const t=a.currentTime+(atraso||0),o=a.createOscillator(),g=a.createGain();o.type=tipo||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||0.07,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03)}
 function ruido(d,vol,freq,atraso){const a=ac();if(!a||mudo||a.state!=='running')return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type='lowpass';fl.frequency.value=freq||1200;g.gain.value=vol||0.15;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(a.currentTime+(atraso||0))}

 return {tom,ruido,seq,
  lim:(k,ms)=>{const n=performance.now();if(_lim[k]&&n-_lim[k]<ms)return false;_lim[k]=n;return true},
  pulo:()=>tom(280,0.16,'square',0.06,720),
  moeda:()=>{tom(988,0.07,'square',0.05);tom(1319,0.2,'square',0.05,null,0.07)},
  item:()=>seq([660,880,1175],0.1,'triangle',0.08,0.06),
  clique:()=>tom(700,0.05,'square',0.04),
  tiro:()=>tom(950,0.09,'square',0.035,180),
  golpe:()=>{ruido(0.09,0.18,1600);tom(170,0.09,'square',0.05,70)},
  dano:()=>{tom(240,0.28,'sawtooth',0.07,55);ruido(0.15,0.1,700)},
  explosao:()=>{ruido(0.55,0.28,550);tom(130,0.45,'sawtooth',0.05,35)},
  fase:()=>seq([523,659,784,1047],0.13,'square',0.05,0.09),
  vitoria:()=>seq([523,659,784,1047,1319],0.2,'square',0.055,0.13),
  derrota:()=>seq([392,330,262,196],0.3,'triangle',0.08,0.2),
  passo:()=>tom(95,0.05,'triangle',0.035),
  susto:()=>{tom(80,0.6,'sawtooth',0.07,40);ruido(0.4,0.12,400)},
  get mudo(){return mudo}};
})();
</script>

// Legenda: . vazio/parede  # grama  S saída  H buraco  o rebatedor  z areia  w água  X moinho
const HOLES = [

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), lam(0x40916c));

function fitCamera() {

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function holeDone() {
  state = 'done'; setTimeout(() => SOM.vitoria(), 250);
  const par = HOLES[holeIdx].par;
  if (!best[holeIdx] || strokes < best[holeIdx]) best[holeIdx] = strokes;
  if (holeIdx + 2 > unlocked && holeIdx < 9) unlocked = holeIdx + 2;
  save();
  total += strokes;
  msg(scoreName(strokes, par), 1600);
  setTimeout(() => {
    $('over').classList.remove('hidden');
    $('oTitle').textContent = holeIdx === 9 ? 'Campo completo! 🏆' : scoreName(strokes, par);
    $('oText').textContent = `${strokes} tacada(s) no par ${par}.` + (holeIdx === 9 ? '' : ` Total acumulado: ${total}.`);
    $('oBtn').textContent = holeIdx === 9 ? 'Jogar de novo' : 'Próximo buraco';
    $('oBtn').onclick = () => {
      $('over').classList.add('hidden');
      if (holeIdx === 9) { start(0); return; }
      holeIdx++; buildHole(holeIdx); state = 'aim'; $('tip').style.opacity = 1;
    };
  }, 1500);
}
$('oMenu').onclick = () => { $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); state = 'menu'; renderMenu(); };
$('reset').onclick = () => { $('menu').classList.remove('hidden'); state = 'menu'; renderMenu(); };
renderMenu();
buildHole(0);

// ---------- Loop ----------
const clock = new THREE.Clock();
let time = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.033); time += dt;
  for (const m of mills) { m.ang += m.w * dt; m.pivot.rotation.y = m.ang; }
  for (const b of bumpers) { b.hitT -= dt; b.m.scale.setScalar(b.hitT > 0 ? 1.25 : 1); }
  if (course.userData.flag) course.userData.flag.rotation.y = Math.sin(time * 2) * 0.3;
  if (state === 'roll') {
    const sub = 6;
    for (let i = 0; i < sub; i++) step(dt / sub);
    ball.rotation.x += vel.y * dt / BALL_R; ball.rotation.z -= vel.x * dt / BALL_R;
    const dh = pos.distanceTo(holePos), sp = vel.length();
    if (dh < HOLE_R && sp < 5.5) { SOM.seq([660,880,1320],.12,'triangle',.08,.08); state = 'sink'; sinkT = 0; vel.set(0, 0); }
    else if (dh < HOLE_R + 0.15 && sp < 5.5) { vel.addScaledVector(holePos.clone().sub(pos).normalize(), 6 * dt); } // puxa levemente para o buraco
    if (cellAt(pos.x, pos.y) === 'w') {
      msg('Splash! +1', 1000); SOM.ruido(.5,.18,700); strokes++; updateHud();
      pos.copy(lastPos); vel.set(0, 0); state = 'aim'; ballY = 0;
    } else if (state === 'roll' && sp < 0.06) {
      vel.set(0, 0); state = 'aim';
      if (strokes >= 10) { msg('Limite de tacadas'); holeDone(); }
    }
  }
  if (state === 'sink') {
    sinkT += dt; pos.lerp(holePos, 0.3); ballY = -sinkT * 1.2;
    if (sinkT > 0.35 && sinkT - dt <= 0.35) holeDone();
  }
  ball.position.set(pos.x, BALL_R + ballY, pos.y);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
function resize() { renderer.setSize(innerWidth, innerHeight); fitCamera(); }
addEventListener('resize', resize); resize();
</script>
