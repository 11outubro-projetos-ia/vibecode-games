let ac,out,osc,osc2,og,fl,nz,nf,ng,mute=0;
function audio(){if(ac){ac.resume&&ac.resume();return}
 try{ac=new AudioContext();out=ac.createGain();out.gain.value=mute?0:1;out.connect(ac.destination);

  const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  nz=ac.createBufferSource();nz.buffer=b;nz.loop=true;nf=ac.createBiquadFilter();nf.type='bandpass';nf.frequency.value=800;
  ng=ac.createGain();ng.gain.value=0;nz.connect(nf);nf.connect(ng);ng.connect(out);nz.start()}catch(e){}}

// nota curta (f -> f2 em d segundos)
function tone(f,d,type,v,f2){if(!ac)return;const o=ac.createOscillator(),x=ac.createGain(),t=ac.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);
 if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);x.gain.setValueAtTime(v||.1,t);x.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(x);x.connect(out);o.start(t);o.stop(t+d)}
function seq(a,step,type,v){a.forEach((f,i)=>setTimeout(()=>tone(f,.18,type,v),i*step))}
function sfx(n){if(!ac)return;
 if(n==='click')tone(700,.05,'square',.05);
 else if(n==='nitro'){tone(500,.25,'square',.07,1300);setTimeout(()=>tone(900,.25,'square',.07,1700),90)}
 else if(n==='repair')seq([520,780,1040],110,'triangle',.12);
 else if(n==='lap')seq([523,659,784,1046],120,'square',.07);
 else if(n==='over'){tone(330,.9,'sawtooth',.12,50);setTimeout(()=>tone(220,.9,'square',.06,40),200)}}
function crash(v=1){if(!ac)return;const n=ac.sampleRate*.45,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
 const s=ac.createBufferSource(),x=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;x.gain.value=.4*v;
 s.buffer=b;s.connect(f);f.connect(x);x.connect(out);s.start();tone(120,.35,'sawtooth',.2*v,35)}
// motor + ruidos continuos (vento, nitro, freio, grama)
function engineSnd(sp,nt,br,off){if(!og)return;const t=ac.currentTime,f=40+sp*150+(nt?30:0);
 osc.frequency.setTargetAtTime(f,t,.05);osc2.frequency.setTargetAtTime(f*.5,t,.05);fl.frequency.setTargetAtTime(500+sp*1500,t,.1);og.gain.setTargetAtTime(.045,t,.05);
 ng.gain.setTargetAtTime(Math.min(.14,sp*.05+(nt?.08:0)+(br&&sp>.2?.06:0)+(off?.06:0)),t,.05);
 nf.frequency.setTargetAtTime(nt?2500:br?3000:off?400:700+sp*800,t,.1)}
function quiet(){if(og){const t=ac.currentTime;og.gain.setTargetAtTime(0,t,.1);ng.gain.setTargetAtTime(0,t,.1)}}
// ===== Pista (estilo pseudo-3D) =====
const segLen=200,roadW=2000,camH=1350,HZ=60,KV=(180-60)/90,depth=.84,playerZ=camH*depth,drawN=130,maxSpeed=12000;
const segs=[];
const lastY=()=>segs.length?segs[segs.length-1].p2.y:0;
const eIn=(a,b,p)=>a+(b-a)*p*p,eIO=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+.5);
function addSeg(c,y){const n=segs.length;segs.push({index:n,curve:c,p1:{y:lastY(),z:n*segLen},p2:{y:y,z:(n+1)*segLen},e:[],tree:(n%5==0)?(Math.random()<.5?-1:1)*(1.5+Math.random()*.8):0})}
function addRoad(e,h,l,c,y){const sy=lastY(),ey=sy+y*segLen,t=e+h+l;
 for(let n=0;n<e;n++)addSeg(eIn(0,c,n/e),eIO(sy,ey,n/t));
 for(let n=0;n<h;n++)addSeg(c,eIO(sy,ey,(e+n)/t));
 for(let n=0;n<l;n++)addSeg(eIO(c,0,n/l),eIO(sy,ey,(e+h+n)/t))}
let N,L,TH,mm=[],mmw=1,mmh=1,trk=0,pilot=0,mode=1,mi=0,cam=0,N_={ttl:0};
const MODES=['FACIL','NORMAL','RADICAL'];
const NP=[{n:'ZE',helm:'#f4a300',stripe:'#fff',skin:'#d9a066'},{n:'LIA',helm:'#ff6fb5',stripe:'#fff',skin:'#f1c27d'},{n:'BIP',helm:'#7fd1ff',stripe:'#222',skin:'#2fe6ff'}];
const TIPS=['Colete o NITRO azul para turbinar!','Caixas verdes consertam o seu carro!','Bata nos rivais para ganhar tempo extra!','Freie antes das curvas fechadas!','Sair da pista faz o carro perder velocidade.','Bata em sequencia para fazer combos!','Barris dao pontos, mas doem um pouco.','Cada volta completa da mais tempo!','No mapa, rivais sao pontos azuis.','Alguns rivais perseguem voce. Fique atento!','Deslize o dedo entre as setas para virar rapido!'];
function npc(w,t,ttl){N_={who:NP[w],text:t,ttl:ttl||4}}
const CH=[{n:'RAIO',d:'Cabeca quente',helm:'#ffd400',stripe:'#e10600',skin:'#f1c27d',car:'#e10600'},
{n:'LUNA',d:'Fria e veloz',helm:'#ff4fa3',stripe:'#fff',skin:'#8d5524',car:'#8a2be2'},
{n:'TITA',d:'Pesada e brutal',helm:'#2bd4a5',stripe:'#111',skin:'#c68642',car:'#0a9b6e'},
{n:'X-9',d:'Robo sem medo',helm:'#aab4c0',stripe:'#2fe6ff',skin:'#2fe6ff',car:'#3b4a5a'}];
const TRK=[
{n:'POR DO SOL',sky:['#1b1038','#3a1a5e','#7a2a6e','#c8467a','#ff7a59','#ffb866'],sun:'#ffe08a',mt:'#2a1747',g1:'#2b8a2b',g2:'#237a23',r:['#4a4a55','#53535e'],rb:['#e10600','#fff'],sc:'tree',ts:14,
 pat:[[25,25,25,0,0],[40,60,40,4,0],[30,50,30,0,30],[40,50,40,-5,-20],[30,40,30,6,10],[20,30,20,0,-15],[40,60,40,-3,25],[25,40,25,5,-20],[30,30,30,-7,10],[30,60,30,0,-10]]},
{n:'DESERTO',sky:['#2a6fb5','#4f95d0','#82b9e0','#f5d9a0','#f7b968','#f29a4a'],sun:'#fff3b0',mt:'#a8643a',g1:'#d9a95a',g2:'#cf9c4a',r:['#55504a','#5f5a52'],rb:['#e8e8e8','#c0392b'],sc:'cactus',ts:20,
 pat:[[30,80,30,0,0],[40,90,40,2,15],[30,60,30,0,-25],[40,80,40,-3,30],[30,100,30,0,-20],[30,50,30,4,10],[40,70,40,-2,-10],[25,60,25,0,0]]},
{n:'NEON NOTURNO',sky:['#05020f','#0b0626','#160a3f','#240c5a','#3a0e72','#5a1190'],sun:'#7ff',mt:'#12063a',g1:'#0f2a3d',g2:'#0b2233',r:['#2a2a3a','#32324a'],rb:['#ff2fb3','#2fe6ff'],sc:'post',ts:12,stars:1,
 pat:[[20,20,20,0,0],[25,30,25,6,0],[20,20,20,-7,5],[25,25,25,5,-5],[20,30,20,-6,0],[20,15,20,8,0],[25,25,25,-8,0],[30,50,30,0,10],[25,30,25,7,-10],[20,20,20,-6,0]]}];
function buildTrack(i){TH=TRK[i];segs.length=0;const b=TH.pat,mir=p=>[p[0],p[1],p[2],-p[3],p[4]];
 b.concat(b.map(mir),b.slice().reverse()).forEach(p=>addRoad(...p));
 addRoad(25,25,25,0,-lastY()/segLen);N=segs.length;L=N*segLen;
 segs.forEach(q=>{q.tree=q.index%TH.ts==0?(Math.random()<.5?-1:1)*(1.5+Math.random()*.8):0;q.fan=q.index%37==11?(Math.random()<.5?-1:1)*(1.55+Math.random()*.3):0});mkMap()}
// Mapa: integra as curvas para desenhar o traçado e fecha o circuito
function mkMap(){let a=0,x=0,y=0,tot=0;const raw=[];segs.forEach(q=>tot+=q.curve*.002);const fix=(Math.PI*2-tot)/N;
 for(let i=0;i<N;i++){a+=segs[i].curve*.002+fix;x+=Math.cos(a);y+=Math.sin(a);if(i%6==0)raw.push({x,y})}
 raw.forEach((p,i)=>{p.x-=x*i/raw.length;p.y-=y*i/raw.length});
 const xs=raw.map(p=>p.x),ys=raw.map(p=>p.y),mx=Math.min(...xs),my=Math.min(...ys),w=Math.max(...xs)-mx,h=Math.max(...ys)-my,z=Math.max(w,h);
 mm=raw.map(p=>({x:(p.x-mx)/z,y:(p.y-my)/z}));mmw=w/z;mmh=h/z}
buildTrack(0);
const find=z=>segs[Math.floor((((z%L)+L)%L)/segLen)];
// ===== Estado do jogo =====

 e.speed=e.t==='c'?maxSpeed*(.25+Math.random()*.45)*[.8,1,1.25][mode]:0;e.col=cols[Math.random()*cols.length|0];e.ag=Math.random()<.5;e.ch=(pilot+1+Math.random()*(CH.length-1)|0)%CH.length}
function reset(){P={speed:0,x:0,pos:0,hp:100,time:[55,40,30][mode],cd:3,tt:6,score:0,kills:0,nitro:.5,lap:1,combo:0,comboT:0};ents=[];booms=[];

 if(state==='pause'){if(ok||k==='p'||k==='escape')setState('play');return}

function menuAct(d,ok){sfx('click');
 if(mi===0){if(ok)start()}else if(mi===1)setTrack(trk+d);else if(mi===2)pilot=(pilot+d+CH.length)%CH.length;
 else if(mi===3){mode=(mode+d+3)%3;loadRank()}else if(mi===4)cam=1-cam;else if(mi===5){if(ok)setState('help')}else if(ok)setState('rank')}
function tap(e){audio();const r=cv.getBoundingClientRect(),cx=(e.clientX-r.left)/r.width*W,cy=(e.clientY-r.top)/r.height*H;
 if(state==='title'){const i=Math.floor((cy-36)/15);if(i>=0&&i<7){mi=i;menuAct(cx<110&&i>0&&i<5?-1:1,1)}}

let rank=[],lastRank=-1;const rk=()=>'f1r'+trk+'_'+mode,fin=()=>Math.floor(P.score*[.7,1,1.5][mode]);
function loadRank(){rank=[];lastRank=-1;try{rank=JSON.parse(localStorage.getItem(rk()))||[]}catch(e){}}
function addRank(s){lastRank=-1;if(s<1||(rank.length>=10&&s<=rank[9].s))return;

function pedirNome(atual,pronto){

 fundo.innerHTML='<form style="background:#1a1a2e;border:3px solid #ffe45c;border-radius:12px;padding:18px;text-align:center;color:#fff;max-width:90vw"><div style="font-size:18px;color:#ffe45c;margin-bottom:10px">🏆 ENTROU NO RANKING!</div><div style="margin-bottom:8px">Seu nome:</div><input maxlength="10" style="font:bold 20px monospace;text-transform:uppercase;padding:8px;width:200px;max-width:70vw;text-align:center;border-radius:8px;border:2px solid #5cd6ff"><br><button style="margin-top:12px;font:bold 16px monospace;padding:10px 24px;background:#ffe45c;border:0;border-radius:8px;cursor:pointer">SALVAR</button></form>';

function render(){
 const rp=cam?(((P.pos+playerZ-150)%L)+L)%L:P.pos,base=find(rp),bp=(rp%segLen)/segLen,ps=find(P.pos+playerZ),pp=((P.pos+playerZ)%segLen)/segLen;

 g.save();if(shake>0)g.translate(Math.round((Math.random()-.5)*shake),Math.round((Math.random()-.5)*shake));
 sky();
 segs.forEach(s=>s.e.length=0);
 ents.forEach(e=>find(e.z).e.push(e));booms.forEach(e=>find(e.z).e.push(e));
 let x=0,dx=-base.curve*bp,maxy=H;
 for(let n=0;n<drawN;n++){const s=segs[(base.index+n)%N],lp=s.index<base.index;s.clip=maxy;
  const cz=rp-(lp?L:0);proj(s.p1,P.x*roadW-x,camY,cz);proj(s.p2,P.x*roadW-x-dx,camY,cz);
  x+=dx;dx+=s.curve;
  if(s.p1.cz<=depth||s.p2.sy>=s.p1.sy||s.p2.sy>=maxy)continue;
  seg(s);maxy=s.p1.sy}
 for(let n=drawN-1;n>=0;n--){const s=segs[(base.index+n)%N];if(s.p1.cz<=depth||s.p1.sy>s.clip+1)continue;

  for(const e of s.e){const pc=(e.z%segLen)/segLen,a=s.p1,b=s.p2,
   sc=a.sc+(b.sc-a.sc)*pc,sx=a.sx+(b.sx-a.sx)*pc+sc*e.o*roadW*W/2,sy=a.sy+(b.sy-a.sy)*pc,w=sc*720*W/2;
   if(e.t==='c')car(sx,sy,w,e.col,e.z/400|0,e.ch);else if(e.t==='b')barrel(sx,sy,w*.6);else if(e.t==='n')bolt(sx,sy,w*.6);else if(e.t==='h')kit(sx,sy,w*.6);else boom(sx,sy,w*2.2*(1.2-e.ttl))}}
 g.globalAlpha=1;
 if(state==='play'&&P.speed/maxSpeed>.6){const nt=(keys[' ']||keys.shift)&&P.nitro>0,v=P.speed/maxSpeed;g.strokeStyle='rgba(255,255,255,'+Math.min(.5,(v-.5)*(nt?.9:.4))+')';g.lineWidth=1;g.beginPath();
  for(let i=0;i<(nt?16:8);i++){const an=Math.random()*6.28,r=60+Math.random()*60,l=15+Math.random()*30;g.moveTo(W/2+Math.cos(an)*r*1.6,HZ+25+Math.sin(an)*r*.8);g.lineTo(W/2+Math.cos(an)*(r+l)*1.6,HZ+25+Math.sin(an)*(r+l)*.8)}g.stroke()}
 // carro do jogador
 const pw=depth/playerZ*720*W/2,sh=P.speed/maxSpeed*(Math.abs(P.x)>1.05?2.5:1),
  steer=steerIn();
 const px=W/2+steer*3,py=H-3-(Math.random()<sh*.4?1:0);
 if(!cam&&P.hp<40)for(let i=0;i<5;i++){g.fillStyle=i%2?'#555':'#999';g.fillRect(px+(Math.random()-.5)*pw*.5,py-pw*.6-Math.random()*20,3,3)}
 if(!cam&&(keys[' ']||keys.shift)&&P.nitro>0&&P.speed>0)for(let i=0;i<6;i++){g.fillStyle=i%2?'#5cf':'#fff';g.fillRect(px+(Math.random()-.5)*pw*.3,py-pw*.2-Math.random()*8,3,3+Math.random()*6)}
 if(cam)cockpit();else car(px,py,pw,CH[pilot].car,P.pos/300|0,pilot,P.br);
 g.restore();
 sparks.forEach(p=>{g.fillStyle=p.t>.25?'#ffe45c':'#ff8a00';g.fillRect(p.x|0,p.y|0,2,2)});pops.forEach(p=>{g.globalAlpha=Math.min(1,p.ttl*2);g.font='bold 16px monospace';g.textAlign='center';g.lineWidth=3;g.strokeStyle='#000';g.strokeText(p.t,p.x,p.y);g.fillStyle=p.c;g.fillText(p.t,p.x,p.y)});g.globalAlpha=1;g.drawImage(vig,0,0);
 // HUD
 g.font='bold 9px monospace';g.textBaseline='top';
 T('TEMPO '+Math.ceil(P.time),6,5,P.time<10?'#ff5252':'#fff');
 T('PONTOS '+Math.floor(P.score),W/2,5,'#ffd400','center');

 face(6,16,16,CH[pilot]);T(CH[pilot].n,26,16,'#fff');T('KILLS '+P.kills+'  VOLTA '+P.lap,26,27,'#ff8a00');minimap(W-70,16,64,54);
 g.fillStyle='#000';g.fillRect(5,H-13,62,8);g.fillRect(W-67,H-13,62,8);

 T('CASCO',6,H-24,'#fff');T('NITRO',W-6,H-24,'#4cc9ff','right');

}
