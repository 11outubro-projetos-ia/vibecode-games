<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mundo de Blocos 3D</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui,Segoe UI,Roboto,sans-serif;touch-action:none}
  canvas{display:block}
  #cross{position:fixed;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none}
  #cross::before,#cross::after{content:'';position:absolute;background:#fff;mix-blend-mode:difference}
  #cross::before{left:9px;top:0;width:2px;height:20px}#cross::after{top:9px;left:0;height:2px;width:20px}
  #mission{position:fixed;top:10px;left:10px;background:#000a;color:#fff;padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;max-width:calc(100vw - 200px);pointer-events:none}
  #mission b{color:#ffd166}
  #mission .bar{height:6px;background:#fff3;border-radius:3px;margin-top:6px;overflow:hidden}
  #mission .bar i{display:block;height:100%;background:#06d6a0;width:0}
  #topR{position:fixed;top:10px;right:10px;display:flex;gap:6px}
  #topR button{border:0;border-radius:10px;background:#000a;color:#fff;font-weight:800;padding:8px 12px;font-size:15px;cursor:pointer}
  #hotbar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#0007;padding:5px;border-radius:10px}
  .slot{width:min(10vw,52px);height:min(10vw,52px);border:3px solid #fff4;border-radius:7px;position:relative;cursor:pointer}
  .slot.sel{border-color:#fff}
  .slot span{position:absolute;right:3px;bottom:1px;color:#fff;font-weight:900;font-size:13px;text-shadow:0 1px 2px #000}
  .slot.empty{opacity:.35}
  #msg{position:fixed;top:30%;width:100%;text-align:center;color:#fff;font-size:clamp(22px,6vw,38px);font-weight:900;text-shadow:0 3px 6px #000;pointer-events:none;opacity:0;transition:opacity .3s}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#2b2d42e8;color:#fff;text-align:center;padding:20px;z-index:5}
  .screen h1{font-size:clamp(30px,8vw,50px);text-shadow:0 4px 0 #000}
  .screen p{max-width:480px;line-height:1.45;opacity:.9}
  .big{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 26px;background:#06d6a0;color:#073b2e;cursor:pointer;box-shadow:0 4px 0 #04936d}
  #mlist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  #mlist div{width:44px;height:44px;border-radius:8px;background:#555;display:flex;align-items:center;justify-content:center;font-weight:900}
  #mlist div.done{background:#06d6a0;color:#073b2e}#mlist div.cur{background:#ffd166;color:#222}
  .hidden{display:none!important}
  #breakBar{position:fixed;left:50%;top:calc(50% + 22px);transform:translateX(-50%);width:60px;height:6px;background:#0006;border-radius:3px;overflow:hidden;pointer-events:none;opacity:0}
  #breakBar i{display:block;height:100%;background:#fff;width:0}
  #touch{position:fixed;inset:0;pointer-events:none}
  .joy{position:absolute;left:20px;bottom:90px;width:120px;height:120px;border-radius:50%;background:#ffffff26;border:2px solid #ffffff66;pointer-events:auto;touch-action:none}
  .knob{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;background:#ffffffaa;transform:translate(-50%,-50%)}
  .tbtn{position:absolute;width:64px;height:64px;border-radius:50%;background:#ffffff33;border:2px solid #ffffff88;display:flex;align-items:center;justify-content:center;font-size:26px;pointer-events:auto;touch-action:none}
  #bBreak{right:20px;bottom:170px}#bPlace{right:96px;bottom:110px}#bJump{right:20px;bottom:90px}
  #lookZone{position:absolute;right:0;top:60px;width:60%;bottom:80px;pointer-events:auto;touch-action:none}
</style>

<script>
/* ===== SONS DO FLIPERAMA (gerados pelo navegador, sem arquivos) — tecla M liga/desliga ===== */
const SOM=(()=>{let A=null,mudo=false;

 function ac(){if(!A){try{A=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(A.state==='suspended')A.resume();return A}

 addEventListener('keydown',e=>{if((e.key==='m'||e.key==='M')&&!e.repeat&&!(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))){mudo=!mudo;try{localStorage.setItem('fliperama-mudo',mudo?'1':'0')}catch(err){}}});
 function tom(f,d,tipo,vol,f2,atraso){const a=ac();if(!a||mudo||a.state!=='running')return;const t=a.currentTime+(atraso||0),o=a.createOscillator(),g=a.createGain();o.type=tipo||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||0.07,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03)}
 function ruido(d,vol,freq,atraso){const a=ac();if(!a||mudo||a.state!=='running')return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type='lowpass';fl.frequency.value=freq||1200;g.gain.value=vol||0.15;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(a.currentTime+(atraso||0))}
 const seq=(notas,dur,tipo,vol,passo)=>notas.forEach((f,i)=>tom(f,dur,tipo,vol,null,i*(passo||dur*0.7)));
 const _lim={};
 return {tom,ruido,seq,
  lim:(k,ms)=>{const n=performance.now();if(_lim[k]&&n-_lim[k]<ms)return false;_lim[k]=n;return true},
  pulo:()=>tom(280,0.16,'square',0.06,720),
  moeda:()=>{tom(988,0.07,'square',0.05);tom(1319,0.2,'square',0.05,null,0.07)},
  item:()=>seq([660,880,1175],0.1,'triangle',0.08,0.06),
  clique:()=>tom(700,0.05,'square',0.04),
  tiro:()=>tom(950,0.09,'square',0.035,180),
  golpe:()=>{ruido(0.09,0.18,1600);tom(170,0.09,'square',0.05,70)},
  dano:()=>{tom(240,0.28,'sawtooth',0.07,55);ruido(0.15,0.1,700)},
  explosao:()=>{ruido(0.55,0.28,550);tom(130,0.45,'sawtooth',0.05,35)},
  fase:()=>seq([523,659,784,1047],0.13,'square',0.05,0.09),
  vitoria:()=>seq([523,659,784,1047,1319],0.2,'square',0.055,0.13),
  derrota:()=>seq([392,330,262,196],0.3,'triangle',0.08,0.2),
  passo:()=>tom(95,0.05,'triangle',0.035),
  susto:()=>{tom(80,0.6,'sawtooth',0.07,40);ruido(0.4,0.12,400)},
  get mudo(){return mudo}};
})();

<script type="module">
import * as THREE from 'three';

const B = { AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, LOG: 4, LEAVES: 5, SAND: 6, PLANKS: 7, GOLD: 8, DIAMOND: 9, BEDROCK: 10, GLASS: 11, BRICK: 12 };
const INFO = {
  1: { name: 'Grama', top: 0x6abe30, side: 0x8a6a3a, bottom: 0x7a5230, hard: 0.35, drop: 2 },
  2: { name: 'Terra', color: 0x7a5230, hard: 0.3 },
  3: { name: 'Pedra', color: 0x8a8a8a, hard: 0.8 },
  4: { name: 'Madeira', side: 0x6b4a2a, top: 0xa8834f, hard: 0.6 },
  5: { name: 'Folhas', color: 0x3f8f2f, hard: 0.15, opacity: 0.92 },
  6: { name: 'Areia', color: 0xe3d38c, hard: 0.3 },
  7: { name: 'Tábuas', color: 0xc49a5a, hard: 0.5 },
  8: { name: 'Ouro', color: 0x8a8a8a, spots: 0xffd700, hard: 1.2 },
  9: { name: 'Diamante', color: 0x7a7a7a, spots: 0x4ef0e8, hard: 1.6 },
  10: { name: 'Rocha-mãe', color: 0x333333, hard: Infinity },
  11: { name: 'Vidro', color: 0xcfefff, hard: 0.2, opacity: 0.35 },
  12: { name: 'Tijolo', color: 0xa84a3a, hard: 0.8 },

const HOTBAR = [B.DIRT, B.STONE, B.LOG, B.PLANKS, B.SAND, B.LEAVES, B.GLASS, B.BRICK];

// ---------- Missões (10 níveis) ----------
const MISSIONS = [

  { text: 'Colete 10 blocos de terra', key: 'got2', n: 10 },
  { text: 'Construa: coloque 10 blocos', key: 'placed', n: 10 },
  { text: 'Cave e colete 10 pedras', key: 'got3', n: 10 },
  { text: 'Crie 8 tábuas (🔨 ou tecla C)', key: 'crafted', n: 8 },
  { text: 'Construa uma torre e suba até a altura 26', key: 'height', n: 26 },
  { text: 'Colete 10 blocos de areia', key: 'got6', n: 10 },
  { text: 'Grande obra: coloque 40 blocos', key: 'placed', n: 40, rel: true },
  { text: 'Encontre 3 minérios de ouro (cave fundo!)', key: 'got8', n: 3 },
  { text: 'Encontre 1 diamante (perto da rocha-mãe)', key: 'got9', n: 1 },

// ---------- Mundo ----------
const SX = 48, SY = 30, SZ = 48;

// ---------- Renderização ----------
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 20, 55);
const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 200);
camera.rotation.order = 'YXZ';
scene.add(new THREE.HemisphereLight(0xffffff, 0x667755, 0.9));
const sunL = new THREE.DirectionalLight(0xffffff, 1.0); sunL.position.set(30, 60, 20); scene.add(sunL);
// sol e nuvens
const sunMesh = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 1), new THREE.MeshBasicMaterial({ color: 0xfff3a0, fog: false })); sunMesh.position.set(SX / 2 + 60, 80, SZ / 2 - 40); sunMesh.lookAt(SX / 2, 0, SZ / 2); scene.add(sunMesh);
for (let i = 0; i < 14; i++) { const c = new THREE.Mesh(new THREE.BoxGeometry(6 + Math.random() * 8, 1.2, 4 + Math.random() * 5), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })); c.position.set(Math.random() * 120 - 36, 40 + Math.random() * 6, Math.random() * 120 - 36); c.userData.cloud = true; scene.add(c); }

// texturas pixeladas geradas em canvas (visual de bloco)
function pixelTex(base, spots, seed) {

const MATS = {};

highlight.visible = false; scene.add(highlight);

// ---------- Estado / salvar ----------
let inv = {}, stats = {}, mission = 0, sel = 0, seed = 1;

let yaw = 0, pitch = 0, onGround = false, running = false;

}

}
function newWorld() {
  seed = Math.floor(Math.random() * 1000);
  generate(seed);
  inv = {}; HOTBAR.forEach(b => inv[b] = 0); inv[B.DIRT] = 5;

let missionBase = 0;
function progressValue(m) {
  if (m.key.startsWith('got')) return stats[m.key] || 0;
  if (m.key === 'placed' && m.rel) return (stats.placed || 0) - missionBase;
  return stats[m.key] || 0;
}
function updateMission() {
  if (mission >= MISSIONS.length) { $('mission').innerHTML = '<b>Todas as missões completas! 🏆</b><br>Modo livre: construa o que quiser.'; return; }
  const m = MISSIONS[mission]; const v = Math.min(m.n, progressValue(m));
  $('mission').innerHTML = `<b>Nível ${mission + 1}/10</b> ${m.text}<br>${v}/${m.n}<div class="bar"><i style="width:${v / m.n * 100}%"></i></div>`;
  if (v >= m.n) {
    mission++; SOM.fase(); missionBase = stats.placed || 0;
    msg(mission >= MISSIONS.length ? 'Você completou o jogo! 🏆' : `Nível ${mission} completo! ✨`, 2200);
    saveGame(); setTimeout(updateMission, 50);
  }
}
function renderMenu() {
  const l = $('mlist'); l.innerHTML = '';
  for (let i = 0; i < 10; i++) { const d = document.createElement('div'); d.textContent = i + 1; d.className = i < mission ? 'done' : i === mission ? 'cur' : ''; l.appendChild(d); }
}
function play() {
  $('menu').classList.add('hidden'); running = true;
  if (isTouch) $('touch').classList.remove('hidden');
  else { try { renderer.domElement.requestPointerLock(); } catch (e) {} }
  missionBase = stats.placed || 0;
  buildHotbar(); updateMission();
}
$('playBtn').onclick = play;
$('newBtn').onclick = () => { newWorld(); rebuild(); saveGame(); play(); };
$('menuBtn').onclick = () => { running = false; saveGame(); try { document.exitPointerLock(); } catch (e) {} $('touch').classList.add('hidden'); renderMenu(); $('menu').classList.remove('hidden'); };
function craft() { SOM.item();
  if ((inv[B.LOG] || 0) < 1) { msg('Precisa de 1 madeira'); return; }
  inv[B.LOG]--; inv[B.PLANKS] = (inv[B.PLANKS] || 0) + 4; stats.crafted = (stats.crafted || 0) + 4;
  msg('+4 tábuas', 800); updateHotbar(); updateMission();
}
$('craftBtn').onclick = craft;

// ---------- Interação com blocos ----------
function raycast(max = 6) {
  const o = camera.position.clone(), d = new THREE.Vector3(); camera.getWorldDirection(d);
  let x = Math.floor(o.x), y = Math.floor(o.y), z = Math.floor(o.z);
  const sx = Math.sign(d.x), sy = Math.sign(d.y), sz = Math.sign(d.z);
  const tdx = Math.abs(1 / d.x), tdy = Math.abs(1 / d.y), tdz = Math.abs(1 / d.z);
  let tx = (sx > 0 ? x + 1 - o.x : o.x - x) * tdx, ty = (sy > 0 ? y + 1 - o.y : o.y - y) * tdy, tz = (sz > 0 ? z + 1 - o.z : o.z - z) * tdz;
  let prev = null, t = 0;
  while (t <= max) {
    if (inside(x, y, z) && get(x, y, z) !== B.AIR) return { x, y, z, prev };
    prev = { x, y, z };
    if (tx < ty && tx < tz) { x += sx; t = tx; tx += tdx; } else if (ty < tz) { y += sy; t = ty; ty += tdy; } else { z += sz; t = tz; tz += tdz; }
  }
  return null;
}
let breaking = false, breakT = 0, breakTarget = null;
function placeBlock() {
  const h = raycast(); if (!h || !h.prev) return;
  const b = HOTBAR[sel];
  if (!inv[b]) { msg(`Sem ${INFO[b].name} — colete primeiro`, 900); return; }
  const { x, y, z } = h.prev; SOM.tom(220,.06,'square',.05,140);
  if (!inside(x, y, z)) return;
  // não colocar dentro do jogador
  if (x + 1 > pos.x - 0.3 && x < pos.x + 0.3 && z + 1 > pos.z - 0.3 && z < pos.z + 0.3 && y + 1 > pos.y && y < pos.y + 1.75) return;
  set(x, y, z, b); inv[b]--; stats.placed = (stats.placed || 0) + 1;
  rebuild(); updateHotbar(); updateMission();
}
function finishBreak(h) { SOM.ruido(.12,.2,1200); SOM.tom(160,.08,'square',.04,90);
  const v = get(h.x, h.y, h.z);
  set(h.x, h.y, h.z, B.AIR);
  const drop = INFO[v].drop || v;
  if (drop === B.GOLD || drop === B.DIAMOND) { stats['got' + drop] = (stats['got' + drop] || 0) + 1; msg(drop === B.GOLD ? '+1 Ouro! ✨' : '+1 Diamante! 💎', 1200); }
  else { inv[drop] = (inv[drop] || 0) + 1; stats['got' + drop] = (stats['got' + drop] || 0) + 1; }
  particles(h, v);
  rebuild(); updateHotbar(); updateMission();
}
const partG = new THREE.BoxGeometry(0.12, 0.12, 0.12), parts = [];
function particles(h, v) {
  const m = Array.isArray(MATS[v]) ? MATS[v][0] : MATS[v];
  for (let i = 0; i < 8; i++) { const p = new THREE.Mesh(partG, m); p.position.set(h.x + Math.random(), h.y + Math.random(), h.z + Math.random()); p.userData.v = new THREE.Vector3((Math.random() - .5) * 3, Math.random() * 3, (Math.random() - .5) * 3); p.userData.t = 0.6; scene.add(p); parts.push(p); }
}

// ---------- Entrada ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code.startsWith('Digit')) { const n = +e.code.slice(5) - 1; if (n >= 0 && n < HOTBAR.length) { sel = n; updateHotbar(); } }
  if (e.code === 'KeyC' && running) craft();
});
addEventListener('keyup', e => keys[e.code] = false);
const cv = renderer.domElement;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => {
  if (!running || isTouch) return;
  if (document.pointerLockElement !== cv) { try { cv.requestPointerLock(); } catch (er) {} }
  if (e.button === 0) breaking = true;
  if (e.button === 2) placeBlock();
});
addEventListener('mouseup', e => { if (e.button === 0) breaking = false; });
addEventListener('mousemove', e => { if (document.pointerLockElement === cv) { yaw -= e.movementX * 0.0022; pitch -= e.movementY * 0.0022; } });
addEventListener('wheel', e => { if (!running) return; sel = (sel + (e.deltaY > 0 ? 1 : -1) + HOTBAR.length) % HOTBAR.length; updateHotbar(); });
const joy = { x: 0, y: 0, id: null };
(() => {
  const el = $('joy'), knob = el.firstElementChild;
  const mv = e => { const r = el.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const m = r.width / 2, d = Math.hypot(dx, dy); if (d > m) { dx *= m / d; dy *= m / d; } joy.x = dx / m; joy.y = dy / m; knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; };
  el.addEventListener('pointerdown', e => { joy.id = e.pointerId; try { el.setPointerCapture(e.pointerId); } catch (_) {} mv(e); });
  el.addEventListener('pointermove', e => { if (e.pointerId === joy.id) mv(e); });
  const end = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = 'translate(-50%,-50%)'; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
})();
(() => {
  const el = $('lookZone'); let id = null, lx = 0, ly = 0;
  el.addEventListener('pointerdown', e => { id = e.pointerId; lx = e.clientX; ly = e.clientY; try { el.setPointerCapture(e.pointerId); } catch (_) {} });
  el.addEventListener('pointermove', e => { if (e.pointerId !== id) return; yaw -= (e.clientX - lx) * 0.006; pitch -= (e.clientY - ly) * 0.006; lx = e.clientX; ly = e.clientY; });
  const end = e => { if (e.pointerId === id) id = null; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
})();
$('bBreak').addEventListener('pointerdown', () => breaking = true);
$('bBreak').addEventListener('pointerup', () => breaking = false);
$('bBreak').addEventListener('pointercancel', () => breaking = false);
$('bPlace').addEventListener('pointerdown', placeBlock);
let jumpBtn = false;
$('bJump').addEventListener('pointerdown', () => jumpBtn = true);
$('bJump').addEventListener('pointerup', () => jumpBtn = false);
$('bJump').addEventListener('pointercancel', () => jumpBtn = false);

// ---------- Física do jogador ----------
const PW = 0.3, PH = 1.75;
function collides(p) {
  for (let x = Math.floor(p.x - PW); x <= Math.floor(p.x + PW); x++)
    for (let y = Math.floor(p.y); y <= Math.floor(p.y + PH - 0.01); y++)
      for (let z = Math.floor(p.z - PW); z <= Math.floor(p.z + PW); z++)
        if (solid(x, y, z) && y >= 0) return true;
  return false;
}
function physics(dt) {
  pitch = Math.max(-1.55, Math.min(1.55, pitch));
  let mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x;
  let mz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0) + joy.y;
  const l = Math.hypot(mx, mz); if (l > 1) { mx /= l; mz /= l; }
  const speed = keys.ShiftLeft ? 6.5 : 4.5;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  vel.x = (mx * cos + mz * sin) * speed;
  vel.z = (-mx * sin + mz * cos) * speed;
  if ((keys.Space || jumpBtn) && onGround) { SOM.pulo(); vel.y = 8.2; onGround = false; }
  vel.y -= 24 * dt; vel.y = Math.max(vel.y, -30);
  const steps = Math.ceil(Math.max(Math.abs(vel.x), Math.abs(vel.y), Math.abs(vel.z)) * dt / 0.05) || 1;
  const sdt = dt / steps;
  onGround = false;
  for (let i = 0; i < steps; i++) {
    pos.x += vel.x * sdt; if (collides(pos)) { pos.x -= vel.x * sdt; }
    pos.z += vel.z * sdt; if (collides(pos)) { pos.z -= vel.z * sdt; }
    pos.y += vel.y * sdt; if (collides(pos)) { pos.y -= vel.y * sdt; if (vel.y < 0) onGround = true; vel.y = 0; }
  }
  if (pos.y < -5) { pos.set(SX / 2 + 0.5, SY, SZ / 2 + 0.5); vel.set(0, 0, 0); }
  stats.height = Math.max(stats.height || 0, Math.floor(pos.y));
  camera.position.set(pos.x, pos.y + 1.6, pos.z);
  camera.rotation.set(pitch, yaw, 0);
}

// ---------- Loop ----------
const clock = new THREE.Clock();
let saveT = 0, lastHeight = 0, menuAng = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (running) {
    physics(dt);
    if (Math.floor(pos.y) !== lastHeight) { lastHeight = Math.floor(pos.y); if (MISSIONS[mission]?.key === 'height') updateMission(); }
    const h = raycast();
    if (h) { highlight.visible = true; highlight.position.set(h.x + 0.5, h.y + 0.5, h.z + 0.5); } else highlight.visible = false;
    if (breaking && h) {
      if (!breakTarget || breakTarget.x !== h.x || breakTarget.y !== h.y || breakTarget.z !== h.z) { breakTarget = h; breakT = 0; }
      const hard = INFO[get(h.x, h.y, h.z)].hard;
      breakT += dt;
      $('breakBar').style.opacity = hard === Infinity ? 0 : 1;
      $('breakBar').firstElementChild.style.width = Math.min(100, breakT / hard * 100) + '%';
      highlight.scale.setScalar(1 + Math.sin(breakT * 30) * 0.02);
      if (breakT >= hard) { finishBreak(h); breakT = 0; breakTarget = null; }
    } else { breakT = 0; breakTarget = null; $('breakBar').style.opacity = 0; highlight.scale.setScalar(1); }
    saveT += dt; if (saveT > 15) { saveT = 0; saveGame(); }
  } else {
    // câmera passeando no menu
    menuAng += dt * 0.05; camera.position.set(SX / 2 + Math.sin(menuAng) * 30, 28, SZ / 2 + Math.cos(menuAng) * 30); camera.lookAt(SX / 2, 10, SZ / 2);
  }
  scene.children.forEach(c => { if (c.userData.cloud) { c.position.x += dt * 0.8; if (c.position.x > 90) c.position.x = -40; } });
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.userData.t -= dt; p.position.addScaledVector(p.userData.v, dt); p.userData.v.y -= 12 * dt; if (p.userData.t <= 0) { scene.remove(p); parts.splice(i, 1); } }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
if (!loadGame()) newWorld();
rebuild(); renderMenu();
loop();
function resize() { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
addEventListener('resize', resize); resize();
</script>
